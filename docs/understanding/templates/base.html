<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="../base.css">
    
    <!-- Optional: Add any extra head content here if needed later -->
</head>
<body>

    <!-- Optional hero image (only include if image exists) -->
    {{image}}

    <!-- Main article content (title + byline injected from the article's own <h1>) -->
    <div class="article-content">
        {{content}}
    </div>

    <!-- Bottom navigation (Previous | Index | Next) -->
    <nav class="nav-bottom">
        {{prev_link}}
        {{index_link}}
        {{next_link}}
    </nav>

    <footer>
        <p>{{ArticleSeries}} • {{PublishDate}}</p>
    </footer>

</body>
</html>
